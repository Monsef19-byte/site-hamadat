<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamadat — Dashboard admin</title>
<link rel="icon" href="/assets/logo/hamadat-logo.png">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- ---------------- Écran de connexion ---------------- -->
<div id="login-screen" class="login-screen">
  <form id="login-form" class="login-card">
    <img src="/assets/logo/hamadat-logo.png" alt="Hamadat" class="login-logo">
    <h1>Dashboard admin</h1>
    <p class="login-sub">Hamadat Promotion Immobilière</p>
    <label>Mot de passe
      <input type="password" id="login-password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary" id="login-submit">Se connecter</button>
    <div class="login-error" id="login-error"></div>
  </form>
</div>

<!-- ---------------- Application admin ---------------- -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="/assets/logo/hamadat-logo.png" alt="Hamadat">
      <div>
        <div class="sidebar-brand-name">Hamadat</div>
        <div class="sidebar-brand-sub">Dashboard admin</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="global">Contenu global</button>
      <button class="nav-item" data-view="carousel">Carrousel accueil</button>
      <button class="nav-item" data-view="residences">Résidences</button>
      <button class="nav-item" data-view="blog">Blog</button>
      <button class="nav-item" data-view="links">Liens</button>
      <button class="nav-item" data-view="videos">Vidéos</button>
      <button class="nav-item" data-view="gallery">Galerie / Catalogue</button>
      <button class="nav-item" data-view="opportunites">Opportunités</button>
      <button class="nav-item" data-view="leads">📥 Demandes reçues</button>
      <button class="nav-item" data-view="settings">Réglages Email</button>
    </nav>
    <div class="sidebar-footer">
      <a href="/index.html" target="_blank" class="sidebar-link">Voir le site ↗</a>
      <button id="logout-btn" class="sidebar-link sidebar-link--danger">Se déconnecter</button>
    </div>
  </aside>

  <main class="main">
    <div id="toast" class="toast hidden"></div>
    <div id="view-global" class="view"></div>
    <div id="view-carousel" class="view hidden"></div>
    <div id="view-residences" class="view hidden"></div>
    <div id="view-blog" class="view hidden"></div>
    <div id="view-links" class="view hidden"></div>
    <div id="view-videos" class="view hidden"></div>
    <div id="view-gallery" class="view hidden"></div>
    <div id="view-opportunites" class="view hidden"></div>
    <div id="view-leads" class="view hidden"></div>
    <div id="view-settings" class="view hidden"></div>
  </main>
</div>

<script src="/admin/icons-data.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
